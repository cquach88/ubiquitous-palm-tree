name: Deploy to GitHub Pages

# Publishes the built site to the gh-pages branch, which GitHub Pages serves.
# (Branch-based deployment: pushing gh-pages auto-configures the Pages site,
# and the default workflow token only needs `contents: write` — the
# artifact-based flow requires enabling Pages by hand in repo settings first.)

on:
  push:
    branches: [main, claude/bai-tu-sac-app-ggvcc9]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
